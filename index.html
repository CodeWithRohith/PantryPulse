<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantry & Grocery Manager</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
    }

    .header-content {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
    }
    .btn-icon:hover {
      background: #f1f5f9;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      background: var(--bg);
      padding: 4px;
      border-radius: var(--radius);
    }

    .tab-btn {
      flex: 1;
      border: none;
      padding: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .badge-count {
      background: var(--danger);
      color: white;
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 2px 7px;
    }

    /* Search & Filter Bar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--card-bg);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    .filters-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-chip {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text-muted);
    }

    .filter-chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Actions Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }
    .btn-danger-outline {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    /* Cards */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .card.low-stock {
      border-left: 5px solid var(--warning);
    }

    .card.out-of-stock {
      border-left: 5px solid var(--danger);
      opacity: 0.85;
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-quick-edit {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .btn-quick-edit:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag.alert {
      background: #fef3c7;
      color: #b45309;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Hybrid Counter */
    .counter {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .counter button {
      background: none;
      border: none;
      width: 30px;
      height: 36px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter button:hover {
      background: #e2e8f0;
    }

    .counter-input-wrap {
      display: flex;
      align-items: center;
      padding: 0 4px;
      background: white;
      height: 36px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .counter-input {
      width: 44px;
      border: none;
      background: transparent;
      text-align: right;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      outline: none;
      -moz-appearance: textfield;
      padding: 2px;
    }

    .counter-input::-webkit-outer-spin-button,
    .counter-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .counter-unit {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 4px;
      white-space: nowrap;
    }

    .btn-quick-cart {
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: var(--primary-dark);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-quick-delete {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-quick-delete:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fecaca;
    }

    /* Shopping List Specific */
    .shop-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .shop-card.checked {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .shop-card input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .shop-qty-input {
      width: 46px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      font-weight: 600;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .restock-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-content">
      <h1>🛒 PantryPulse</h1>
      <div style="display: flex; gap: 6px;">
        <button class="btn-icon" onclick="clearAllDataPrompt()" title="Wipe out everything and start completely fresh">🧹 Clean Slate</button>
        <button class="btn-icon" onclick="exportData()" title="Backup to JSON">💾 Backup</button>
        <button class="btn-icon" onclick="importPrompt()" title="Restore from JSON">📥 Restore</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabPantryBtn" onclick="switchTab('pantry')">
        📦 Home Inventory
      </button>
      <button class="tab-btn" id="tabShopBtn" onclick="switchTab('shop')">
        📝 Shopping List
        <span class="badge-count" id="shopBadge" style="display: none;">0</span>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- PANTRY VIEW -->
    <section id="pantryView">
      <div class="toolbar">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="🔍 Search items (e.g., eggs, milk, cumin)..." 
          oninput="renderPantry()"
        />
        <div class="filters-row">
          <button class="filter-chip active" onclick="setFilter('all', this)">All</button>
          <button class="filter-chip" onclick="setFilter('low', this)">⚠️ Low Stock</button>
          <button class="filter-chip" onclick="setFilter('Fridge', this)">❄️ Fridge</button>
          <button class="filter-chip" onclick="setFilter('Freezer', this)">🧊 Freezer</button>
          <button class="filter-chip" onclick="setFilter('Pantry', this)">🥫 Pantry</button>
          <button class="filter-chip" onclick="setFilter('Spices', this)">🌶️ Spices</button>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-secondary" onclick="addLowItemsToShoppingList()">
          ➕ Add Low Stock to List
        </button>
        <button class="btn btn-primary" onclick="openItemModal()">
          + Add Item
        </button>
      </div>

      <div class="item-list" id="pantryListContainer"></div>
    </section>

    <!-- SHOPPING LIST VIEW -->
    <section id="shopView" style="display: none;">
      <div class="restock-banner">
        <span>Check off items as you buy them in store.</span>
        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="restockChecked()">
          ✅ Restock Checked
        </button>
      </div>

      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input 
          type="text" 
          id="quickShopInput" 
          class="search-input" 
          placeholder="Quick add item to buy..." 
          onkeydown="if(event.key === 'Enter') quickAddShoppingItem()"
        />
        <button class="btn btn-primary" onclick="quickAddShoppingItem()">Add</button>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button class="btn-icon" style="color: var(--danger); border: none;" onclick="clearEntireShoppingList()">
          🗑️ Clear Shopping List
        </button>
      </div>

      <div class="item-list" id="shoppingListContainer"></div>
    </section>

  </main>

  <!-- ADD / EDIT MODAL -->
  <div class="modal-overlay" id="itemModal">
    <div class="modal">
      <h2 class="modal-title" id="modalHeading">Add Item to Home</h2>
      <form id="itemForm" onsubmit="saveItem(event)">
        <input type="hidden" id="itemId" />

        <div class="form-group">
          <label>Item Name * (e.g. rename Olive Oil to Sunflower Oil)</label>
          <input type="text" id="itemName" required placeholder="e.g. Greek Yogurt, Basmati Rice" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Current Quantity *</label>
            <input type="number" step="any" min="0" id="itemQty" required value="1" />
          </div>
          <div class="form-group">
            <label>Unit *</label>
            <select id="itemUnit">
              <option value="pcs">pcs</option>
              <option value="kg">kg</option>
              <option value="g">grams</option>
              <option value="L">Liters</option>
              <option value="ml">ml</option>
              <option value="bottles">bottles</option>
              <option value="cans">cans</option>
              <option value="packs">packs</option>
              <option value="boxes">boxes</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Storage Location</label>
            <select id="itemLocation">
              <option value="Fridge">Fridge</option>
              <option value="Freezer">Freezer</option>
              <option value="Pantry">Pantry</option>
              <option value="Spices">Spice Rack</option>
            </select>
          </div>
          <div class="form-group">
            <label>Low Alert (≤)</label>
            <input type="number" step="any" min="0" id="itemThreshold" value="1" title="Alert me when quantity falls to or below this" />
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="modalDeleteBtn" class="btn btn-secondary" style="color: var(--danger); display: none;" onclick="deleteCurrentPantryItem()">Delete Item</button>
          <div style="display: flex; gap: 8px; margin-left: auto;">
            <button type="button" class="btn btn-secondary" onclick="closeItemModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="importInput" style="display: none;" accept=".json" onchange="importData(event)" />

  <script>
    const STORAGE_KEY = "grocery_pantry_app_data_v1";

    let state = {
      pantry: [],
      shoppingList: []
    };

    let activeFilter = 'all';

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("Corrupt data, loading defaults");
          loadSampleData();
        }
      } else {
        loadSampleData();
      }
      renderPantry();
      renderShoppingList();
      updateBadges();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateBadges();
    }

    function loadSampleData() {
      state = {
        pantry: [
          { id: '1', name: 'Eggs', qty: 4, unit: 'pcs', location: 'Fridge', threshold: 4 },
          { id: '2', name: 'Whole Milk', qty: 0.5, unit: 'L', location: 'Fridge', threshold: 1 },
          { id: '3', name: 'Olive Oil', qty: 1, unit: 'bottles', location: 'Pantry', threshold: 1 },
          { id: '4', name: 'Basmati Rice', qty: 2.5, unit: 'kg', location: 'Pantry', threshold: 1 },
          { id: '5', name: 'Garlic Powder', qty: 1, unit: 'bottles', location: 'Spices', threshold: 1 },
          { id: '6', name: 'Frozen Peas', qty: 0, unit: 'packs', location: 'Freezer', threshold: 1 }
        ],
        shoppingList: [
          { id: 's1', pantryId: '2', name: 'Whole Milk', qtyToBuy: 1, unit: 'L', checked: false },
          { id: 's2', pantryId: '6', name: 'Frozen Peas', qtyToBuy: 1, unit: 'packs', checked: false }
        ]
      };
      saveState();
    }

    function clearAllDataPrompt() {
      if (confirm("Are you sure you want to remove ALL items and start with a completely empty pantry?")) {
        state = { pantry: [], shoppingList: [] };
        saveState();
        renderPantry();
        renderShoppingList();
      }
    }

    function switchTab(tab) {
      const pantryView = document.getElementById('pantryView');
      const shopView = document.getElementById('shopView');
      const tabPantryBtn = document.getElementById('tabPantryBtn');
      const tabShopBtn = document.getElementById('tabShopBtn');

      if (tab === 'pantry') {
        pantryView.style.display = 'block';
        shopView.style.display = 'none';
        tabPantryBtn.classList.add('active');
        tabShopBtn.classList.remove('active');
        renderPantry();
      } else {
        pantryView.style.display = 'none';
        shopView.style.display = 'block';
        tabPantryBtn.classList.remove('active');
        tabShopBtn.classList.add('active');
        renderShoppingList();
      }
    }

    function updateBadges() {
      const shopBadge = document.getElementById('shopBadge');
      const count = state.shoppingList.filter(item => !item.checked).length;
      if (count > 0) {
        shopBadge.textContent = count;
        shopBadge.style.display = 'inline-block';
      } else {
        shopBadge.style.display = 'none';
      }
    }

    function setFilter(filterType, el) {
      activeFilter = filterType;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderPantry();
    }

    function renderPantry() {
      const container = document.getElementById('pantryListContainer');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      let items = state.pantry.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(search);
        let matchesFilter = true;

        if (activeFilter === 'low') {
          matchesFilter = item.qty <= item.threshold;
        } else if (activeFilter !== 'all') {
          matchesFilter = item.location === activeFilter;
        }

        return matchesSearch && matchesFilter;
      });

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No pantry items found. Tap <strong>+ Add Item</strong> to add what you have at home.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => {
        const isOutOfStock = item.qty <= 0;
        const isLowStock = !isOutOfStock && item.qty <= item.threshold;
        let cardClass = "card";
        if (isOutOfStock) cardClass += " out-of-stock";
        else if (isLowStock) cardClass += " low-stock";

        return `
          <div class="${cardClass}">
            <div class="card-info">
              <div class="card-title-row">
                <span class="card-title" title="${item.name}">${item.name}</span>
                <button class="btn-quick-edit" onclick="editItem('${item.id}')" title="Rename or edit details">✏️</button>
              </div>
              <div class="card-meta">
                <span class="tag">${item.location}</span>
                ${isOutOfStock ? `<span class="tag alert">Out of Stock</span>` : ''}
                ${isLowStock ? `<span class="tag alert">Low (≤ ${item.threshold})</span>` : ''}
              </div>
            </div>

            <div class="card-actions">
              <!-- Counter with Direct Number Input + Buttons -->
              <div class="counter">
                <button type="button" onclick="changeQty('${item.id}', -1)" title="Decrease by 1">−</button>
                <div class="counter-input-wrap">
                  <input 
                    type="number" 
                    class="counter-input" 
                    value="${item.qty}" 
                    min="0" 
                    step="any"
                    onfocus="this.select()"
                    onchange="setDirectQty('${item.id}', this.value)"
                  />
                  <span class="counter-unit">${item.unit}</span>
                </div>
                <button type="button" onclick="changeQty('${item.id}', 1)" title="Increase by 1">+</button>
              </div>

              <!-- Quick Add to Shopping List -->
              <button class="btn-quick-cart" onclick="sendToShoppingList('${item.id}')" title="Add to shopping list">
                🛒+
              </button>

              <!-- One-click Direct Remove from Inventory -->
              <button class="btn-quick-delete" onclick="quickDeletePantryItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')" title="Remove item permanently">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(id, delta) {
      const item = state.pantry.find(i => i.id === id);
      if (!item) return;

      const newQty = Number((item.qty + delta).toFixed(2));
      item.qty = Math.max(0, newQty);
      saveState();
      renderPantry();
    }

    function setDirectQty(id, value) {
      const item = state.pantry.find(i => i.id === id);
      if (!item) return;

      const parsed = parseFloat(value);
      if (isNaN(parsed) || parsed < 0) {
        renderPantry();
        return;
      }

      item.qty = Number(parsed.toFixed(2));
      saveState();
      renderPantry();
    }

    // Direct removal from card
    function quickDeletePantryItem(id, name) {
      if (confirm(`Remove "${name}" completely from your home pantry?`)) {
        // Remove from pantry
        state.pantry = state.pantry.filter(p => p.id !== id);
        // Also clean up any lingering item in shopping list
        state.shoppingList = state.shoppingList.filter(s => s.pantryId !== id);
        saveState();
        renderPantry();
      }
    }

    function sendToShoppingList(pantryId) {
      const item = state.pantry.find(i => i.id === pantryId);
      if (!item) return;

      const existing = state.shoppingList.find(s => s.pantryId === pantryId);
      if (existing) {
        existing.qtyToBuy += 1;
        existing.checked = false;
      } else {
        state.shoppingList.push({
          id: 's_' + Date.now(),
          pantryId: item.id,
          name: item.name,
          qtyToBuy: 1,
          unit: item.unit,
          checked: false
        });
      }
      saveState();
      alert(`Added "${item.name}" to your shopping list!`);
    }

    function addLowItemsToShoppingList() {
      let addedCount = 0;
      state.pantry.forEach(item => {
        if (item.qty <= item.threshold) {
          const exists = state.shoppingList.some(s => s.pantryId === item.id);
          if (!exists) {
            state.shoppingList.push({
              id: 's_' + Math.random().toString(36).substr(2, 9),
              pantryId: item.id,
              name: item.name,
              qtyToBuy: Math.max(1, item.threshold - item.qty || 1),
              unit: item.unit,
              checked: false
            });
            addedCount++;
          }
        }
      });
      saveState();
      alert(`Added ${addedCount} low/empty items to your shopping list.`);
      renderShoppingList();
    }

    // -------------------------------------------------------------
    // SHOPPING LIST
    // -------------------------------------------------------------
    function renderShoppingList() {
      const container = document.getElementById('shoppingListContainer');

      if (state.shoppingList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>🎉 All stocked up! Your shopping list is empty.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = state.shoppingList.map(item => `
        <div class="shop-card ${item.checked ? 'checked' : ''}">
          <input 
            type="checkbox" 
            ${item.checked ? 'checked' : ''} 
            onchange="toggleShopCheck('${item.id}', this.checked)"
          />
          <div style="flex: 1; font-weight: 600;">
            ${item.name}
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <input 
              type="number" 
              class="shop-qty-input" 
              min="0.1" 
              step="any" 
              value="${item.qtyToBuy}"
              onfocus="this.select()"
              onchange="updateShopQty('${item.id}', this.value)"
            />
            <span style="font-size: 0.8rem; color: var(--text-muted);">${item.unit}</span>
          </div>
          <button class="btn-icon" style="color: var(--danger); border: none;" onclick="deleteShopItem('${item.id}')" title="Remove from shopping list">
            ✕
          </button>
        </div>
      `).join('');
    }

    function updateShopQty(id, value) {
      const item = state.shoppingList.find(s => s.id === id);
      if (!item) return;
      const parsed = parseFloat(value);
      if (!isNaN(parsed) && parsed > 0) {
        item.qtyToBuy = Number(parsed.toFixed(2));
        saveState();
      }
      renderShoppingList();
    }

    function toggleShopCheck(id, checked) {
      const item = state.shoppingList.find(s => s.id === id);
      if (item) {
        item.checked = checked;
        saveState();
        renderShoppingList();
      }
    }

    function quickAddShoppingItem() {
      const input = document.getElementById('quickShopInput');
      const val = input.value.trim();
      if (!val) return;

      const pantryMatch = state.pantry.find(p => p.name.toLowerCase() === val.toLowerCase());

      state.shoppingList.push({
        id: 's_' + Date.now(),
        pantryId: pantryMatch ? pantryMatch.id : null,
        name: val,
        qtyToBuy: 1,
        unit: pantryMatch ? pantryMatch.unit : 'pcs',
        checked: false
      });

      input.value = '';
      saveState();
      renderShoppingList();
    }

    function deleteShopItem(id) {
      state.shoppingList = state.shoppingList.filter(s => s.id !== id);
      saveState();
      renderShoppingList();
    }

    function clearEntireShoppingList() {
      if (state.shoppingList.length === 0) return;
      if (confirm("Clear all items currently in your shopping list?")) {
        state.shoppingList = [];
        saveState();
        renderShoppingList();
      }
    }

    function restockChecked() {
      const checkedItems = state.shoppingList.filter(s => s.checked);

      if (checkedItems.length === 0) {
        alert("Tick off items first as you put them in your cart!");
        return;
      }

      checkedItems.forEach(item => {
        if (item.pantryId) {
          const pantryItem = state.pantry.find(p => p.id === item.pantryId);
          if (pantryItem) {
            pantryItem.qty = Number((pantryItem.qty + item.qtyToBuy).toFixed(2));
          }
        } else {
          state.pantry.push({
            id: 'p_' + Date.now() + Math.random().toString(36).substr(2, 4),
            name: item.name,
            qty: item.qtyToBuy,
            unit: item.unit || 'pcs',
            location: 'Pantry',
            threshold: 1
          });
        }
      });

      state.shoppingList = state.shoppingList.filter(s => !s.checked);

      saveState();
      renderPantry();
      renderShoppingList();
      alert(`Restocked ${checkedItems.length} items to your home inventory!`);
    }

    // -------------------------------------------------------------
    // MODAL
    // -------------------------------------------------------------
    function openItemModal() {
      document.getElementById('modalHeading').textContent = "Add Item";
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = "";
      document.getElementById('modalDeleteBtn').style.display = "none";
      document.getElementById('itemModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = state.pantry.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalHeading').textContent = "Edit / Rename Item";
      document.getElementById('itemId').value = item.id;
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemQty').value = item.qty;
      document.getElementById('itemUnit').value = item.unit;
      document.getElementById('itemLocation').value = item.location;
      document.getElementById('itemThreshold').value = item.threshold;
      document.getElementById('modalDeleteBtn').style.display = "block";

      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeItemModal() {
      document.getElementById('itemModal').style.display = 'none';
    }

    function deleteCurrentPantryItem() {
      const id = document.getElementById('itemId').value;
      if (!id) return;
      const item = state.pantry.find(p => p.id === id);
      quickDeletePantryItem(id, item ? item.name : "this item");
      closeItemModal();
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('itemId').value;
      const name = document.getElementById('itemName').value.trim();
      const qty = parseFloat(document.getElementById('itemQty').value) || 0;
      const unit = document.getElementById('itemUnit').value;
      const location = document.getElementById('itemLocation').value;
      const threshold = parseFloat(document.getElementById('itemThreshold').value) || 0;

      if (id) {
        // Edit / Rename existing
        const item = state.pantry.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.qty = qty;
          item.unit = unit;
          item.location = location;
          item.threshold = threshold;

          // If renamed, update name on shopping list as well
          state.shoppingList.forEach(s => {
            if (s.pantryId === id) s.name = name;
          });
        }
      } else {
        state.pantry.push({
          id: 'p_' + Date.now(),
          name,
          qty,
          unit,
          location,
          threshold
        });
      }

      saveState();
      closeItemModal();
      renderPantry();
      renderShoppingList();
    }

    // -------------------------------------------------------------
    // BACKUP & RESTORE
    // -------------------------------------------------------------
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `pantry_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importPrompt() {
      document.getElementById('importInput').click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.pantry && parsed.shoppingList) {
            state = parsed;
            saveState();
            renderPantry();
            renderShoppingList();
            alert("Data imported successfully!");
          } else {
            alert("Invalid backup file format.");
          }
        } catch (err) {
          alert("Error parsing backup file.");
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
